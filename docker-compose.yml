services:
  db:
    image: mysql:8.4
    container_name: xishie-db
    environment:
      MYSQL_DATABASE: xishie
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${DB_HOST_PORT:-3514}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - xishie-network

  # GUI database: phpMyAdmin (akses di http://localhost:${PHPMYADMIN_HOST_PORT})
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: xishie-phpmyadmin
    environment:
      # Terhubung ke service "db" di jaringan compose (bukan localhost).
      PMA_HOST: ${DB_SERVICE:-db}
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8422}:80"
    depends_on:
      - db
    networks:
      - xishie-network

  # GRUP APACHE
  apache:
    build:
      context: .
      dockerfile: ./docker-apache/Dockerfile
    container_name: xishie-apache
    profiles: ["apache"] # <--- Hanya jalan jika dipanggil
    entrypoint: ["/bin/sh", "/var/www/html/docker-nginx/entrypoint.sh"]
    command: apache2-foreground
    environment:
      DB_SETUP: ${DB_SETUP:-migrate}
    ports:
      # Port terpisah dari nginx agar kedua profil dapat berjalan bersamaan.
      - "${APACHE_HOST_PORT:-8316}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - xishie-network

  # GRUP NGINX (Terdiri dari Nginx + PHP-FPM)
  php-fpm:
    build:
      context: .
      dockerfile: ./docker-nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: xishie-php-fpm
    profiles: ["nginx"] # <--- Ikut grup nginx
    # Jalankan sebagai UID/GID host (www-data dipetakan ke 1000 di Dockerfile)
    # agar berkas yang dibuat artisan/npm di bind mount tidak dimiliki root.
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["/bin/sh", "/var/www/html/docker-nginx/entrypoint.sh"]
    command: php-fpm
    environment:
      DB_SETUP: ${DB_SETUP:-migrate}
      # Home writable agar tinker (psysh) & cache composer tidak gagal menulis
      # ketika container berjalan sebagai UID non-root.
      HOME: /tmp
    ports:
      - "${PHPFPM_HOST_PORT:-9208}:9000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - xishie-network

  nginx:
    image: nginx:alpine
    container_name: xishie-nginx
    profiles: ["nginx"] # <--- Ikut grup nginx
    ports:
      - "${NGINX_HOST_PORT:-8208}:80"
      - "${VITE_HOST_PORT:-5381}:5173" # misal pakai vite
    volumes:
      - .:/var/www/html
      - ./docker-nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - xishie-network

networks:
  xishie-network:
    driver: bridge

volumes:
  mysql_data:
